name: Coleta Diária de Tendências

on:
  schedule:
    - cron: '0 10 * * *'  # 07h BRT (10h UTC)
    - cron: '0 18 * * *'  # 15h BRT — 2ª tentativa se o Trends bloqueou de manhã
  workflow_dispatch:
    inputs:
      force:
        description: 'Sobrescrever dados do dia mesmo que já existam'
        required: false
        default: 'false'
        type: boolean
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar coleta
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          FLAGS=""
          [ "${{ github.event.inputs.force }}" = "true" ] && FLAGS="--force"
          [ "${{ github.event.schedule }}" = "0 18 * * *" ] && FLAGS="--refresh-if-stale"
          echo "flags: $FLAGS"
          python collect.py $FLAGS

      - name: Commit dos dados coletados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "data: tendências $(date +%Y-%m-%d)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
